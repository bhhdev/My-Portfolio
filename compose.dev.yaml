services:
  nginx:
    image: nginx:alpine
    container_name: my-portfolio-nginx-dev
    ports:
      - "9090:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - portfolio_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: my-portfolio-php-dev
    env_file:
      - .env.local
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
    networks:
      - portfolio_network

  database:
    image: mariadb:11
    container_name: my-portfolio-db-dev
    env_file:
      - .env.local
    volumes:
      - db_data_dev:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - portfolio_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: my-portfolio-pma
    depends_on:
      - database
    environment:
      PMA_HOST: database
    ports:
      - "9091:80"
    networks:
      - portfolio_network

volumes:
  db_data_dev:

networks:
  portfolio_network:
    driver: bridge
